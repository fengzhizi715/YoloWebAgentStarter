name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-provenance:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/check_release_provenance.py

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: PYTHONPATH=backend .venv/bin/python -m compileall -q backend/app
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
          YOLO_CONFIG_DIR: ${{ runner.temp }}/ultralytics
      - run: PYTHONPATH=backend .venv/bin/pytest backend/tests
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
          YOLO_CONFIG_DIR: ${{ runner.temp }}/ultralytics

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build

  cpu-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r backend/requirements.txt
      - run: PYTHONPATH=backend .venv/bin/python scripts/run_cpu_smoke.py
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
          YOLO_CONFIG_DIR: ${{ runner.temp }}/ultralytics
